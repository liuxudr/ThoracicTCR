[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thoracictcr"
version = "0.1.0"
description = "Pan-thoracic T-cell receptor repertoire atlas + prognostic/ICI-response toolkit across LUAD/LUSC/ESCA/MESO/THYM"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "WZ Lab"}]
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-bio>=0.5",
    "lifelines>=0.27",
    "lightgbm>=4.0",
    "shap>=0.43",
    "biopython>=1.81",
    "anndata>=0.10",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "tqdm>=4.65",
    "requests>=2.31",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.17",
    "pysam>=0.22",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "ipykernel>=6.25",
    "jupyterlab>=4.0",
]

[project.scripts]
thoracictcr = "thoracictcr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thoracictcr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
