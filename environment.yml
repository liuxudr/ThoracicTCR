name: thoracictcr
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core scientific
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  # Bioinformatics tools
  - trust4
  - arcas-hla
  - samtools
  - pysam>=0.22
  - gdc-client
  - sra-tools>=3.0   # prefetch / fasterq-dump for GEO/SRA fastq
  - aria2            # parallel HTTP/FTP downloader for ENA mirrors
  - bwa
  - star
  - parallel
  # I/O and CLI
  - pyyaml>=6.0
  - typer>=0.12
  - rich>=13.0
  - tqdm>=4.65
  - requests>=2.31
  - biopython>=1.81
  # Stats / survival / ML
  - lifelines>=0.27
  - lightgbm>=4.0
  - statsmodels>=0.14
  # Plotting (exploratory)
  - matplotlib>=3.7
  - seaborn>=0.13
  - plotly>=5.17
  # Dev
  - pytest>=7.4
  - jupyterlab>=4.0
  - ipykernel>=6.25
  - ruff>=0.1
  - pip:
      - scikit-bio>=0.5
      - shap>=0.43
      - anndata>=0.10
      # NOTE: immunarch is R-only; install via R: install.packages("immunarch")
